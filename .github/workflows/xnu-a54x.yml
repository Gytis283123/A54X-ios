name: XNU 26.2 A54X bring-up

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: XNU build configuration
        type: choice
        options: [DEVELOPMENT, DEBUG, RELEASE]
        default: DEVELOPMENT
      keep_going:
        description: Collect compile errors across files
        type: boolean
        default: true

concurrency:
  group: xnu-a54x-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: "26.2"
  ARCH_CONFIG: ARM64
  MACHINE_CONFIG: A54X
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned builder and A54X patch
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # darwin-xnu-build falls back to patches/26.0 for macOS 26.2.
          cp xnu/patches-a54x/*.patch dxb/patches/26.0/
          # libfirehose_kernel is otherwise built without the plain arm64 slice.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          # Keep concurrent compiler diagnostics readable in the Actions log.
          sed -i '' 's/VERBOSE=YES/VERBOSE=NO/g; s/CONCISE=0/CONCISE=1/g' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          grep -c 'VERBOSE=NO' dxb/build.sh
          ls dxb/patches/26.0

      - name: Install build dependencies
        run: |
          brew install jq gum cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU 26.2 A54X
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going && '-k' || '' }}
        run: bash build.sh

      - name: Collect kernel artifact
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-a54x-26.2
          path: out/
          if-no-files-found: warn
          retention-days: 14
